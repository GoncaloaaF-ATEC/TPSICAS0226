services:
  mongodb:
    image: mongo:7
    container_name: mongodb_CAS0226
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: aulasTPSICAS0226

    volumes:
      - mongo-data:/data/db


volumes:
  mongo-data:
